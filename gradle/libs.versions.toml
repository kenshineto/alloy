[versions]
lodestone = "0.3-SNAPSHOT"
jackson = "2.22.3"
sqlite = "3.53.4.0"
mysql = "26.7.0"
postgresql = "42.7.14"
hikari = "4.0.3"

[libraries]
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }

[plugins]
lodestone = { id = "cat.freya.lodestone", version.ref = "lodestone" }
